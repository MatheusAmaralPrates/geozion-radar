name: Search Console (impressões no Google, diário)
on:
  schedule:
    - cron: '41 9 * * *'   # todo dia, 6h41 em Brasília
  workflow_dispatch:
concurrency: { group: gsc, cancel-in-progress: false }
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install google-auth==2.35.0 requests==2.32.3
      - name: Ler o Search Console e gravar no KV
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_ID: ${{ secrets.CF_KV_ID }}
        run: |
          if [ -z "$GSC_SA_JSON" ]; then echo "::warning::Falta o secret GSC_SA_JSON (chave da conta de serviço do Search Console)."; exit 0; fi
          python tools/gsc/coletor.py
