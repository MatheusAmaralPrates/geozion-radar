name: Baixar dados públicos (arquivo temporário)
# Baixa arquivos de fontes oficiais (ANA, IBGE, MapBiomas...) e os entrega como artefato da execução,
# para serem processados no pipeline do Monitor. Também grava os arquivos no ramo 'dados-brutos' (sobrescrito a cada execução).
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por espaço'
        required: true
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar
        env: { URLS: '${{ inputs.urls }}' }
        run: |
          mkdir -p out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1)); f="${i}_$(basename "${u%%\?*}")"
            echo "-> $u"
            curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$f" "$u" && ls -la "$f" || echo "FALHOU $u"
          done
      - uses: actions/upload-artifact@v4
        with: { name: dados, path: out, retention-days: 3 }
      - name: Gravar no ramo dados-brutos
        run: |
          cd out
          git init -q -b dados-brutos && git add -A
          git -c user.name=geozion-bot -c user.email=bot@geozion.invalid commit -qm "dados brutos $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dados-brutos
